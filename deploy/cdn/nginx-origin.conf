# Фрагмент для krotman: вмержить в УЖЕ стоящий server { listen 443 ... }.
# Не заменять весь сайт и не удалять location панели/подписки.
# server_name дополнить origin.gloru.dpdns.org; cert — новый или тот же LE.

server {
    listen 80;
    listen [::]:80;
    server_name origin.gloru.dpdns.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 127.0.0.1:8443 ssl http2;
    # listen 443 ssl http2;
    # listen [::]:443 ssl http2;
    server_name origin.gloru.dpdns.org;

    ssl_certificate     /etc/letsencrypt/live/origin.gloru.dpdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/origin.gloru.dpdns.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/stub;
    index index.html;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"media-gateway","version":"4.2.1"}';
    }

    # Замените path на свой секретный и тот же в inbound-xhttp.json
    location /api/stream {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffer_size 32k;
        proxy_buffers 8 32k;
        client_max_body_size 0;
        add_header X-Accel-Buffering no always;
        add_header Cache-Control "no-store, no-transform" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
